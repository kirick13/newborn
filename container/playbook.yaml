---

- hosts: all
  vars:
    firewall_http_anywhere: |
      # Allow access to ports 80 and 443
      call_iptables -A $CHAIN -p tcp --dport 80 -j ACCEPT
      call_iptables -A $CHAIN -p tcp --dport 443 -j ACCEPT
    firewall_http_cloudflare: |
      # Allow access to ports 80 and 443 from Cloudflare
      CF_IP_RANGES_V4=$(curl -Ls https://www.cloudflare.com/ips-v4)
      for ip in ${CF_IP_RANGES_V4}
      do
          iptables -A $CHAIN -p tcp -s $ip --dport 80  -m comment --comment 'Cloudflare' -j RETURN
          iptables -A $CHAIN -p tcp -s $ip --dport 443 -m comment --comment 'Cloudflare' -j RETURN
      done
      CF_IP_RANGES_V6=$(curl -Ls https://www.cloudflare.com/ips-v6)
      for ip in ${CF_IP_RANGES_V6}
      do
          ip6tables -A $CHAIN -p tcp -s $ip --dport 80  -m comment --comment 'Cloudflare' -j RETURN
          ip6tables -A $CHAIN -p tcp -s $ip --dport 443 -m comment --comment 'Cloudflare' -j RETURN
      done

  tasks:

    # Variables from facts gathering such as "ansible_machine", "ansible_architecture" or "ansible_userspace_architecture" are wrong about "amd64" architecture, they state that this is an "x86_64"
    - name: Get architecture of target node
      shell: dpkg --print-architecture
      register: newborn_arch

    # ┌─────────────┐
    # │   GHOSTTY   │
    # └─────────────┘

    - name: Copy Ghostty terminfo file
      copy:
        src: configs/ghostty.txt
        dest: /tmp/ghostty.txt
        owner: root
        group: root
        mode: '0755'

    - name: Add Ghostty terminfo
      shell: tic -x /tmp/ghostty.txt

    - name: Delete Ghostty terminfo file
      file:
        path: /tmp/ghostty.txt
        state: absent

    # ┌─────────────┐
    # │   SCRIPTS   │
    # └─────────────┘

    - name: Create directory for scripts
      file:
        path: /root/newborn
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Copy scripts
      copy:
        src: "scripts/{{ item }}"
        dest: /root/newborn/{{ item }}
        owner: root
        group: root
        mode: '0755'
      loop:
        - iptables.sh
        - swap.sh

    # ┌────────────────┐
    # │   SOME SETUP   │
    # └────────────────┘

    - name: Set swap
      shell: "/root/newborn/swap.sh {{ newborn_swap }}"

    - name: Resize filesystem
      shell: |
        DISK_LABEL=$(df | grep -E '\/$' | awk '{print $1}')
        resize2fs $DISK_LABEL
        df -h | grep $DISK_LABEL
        unset DISK_LABEL

    - name: Set UTC timezone
      shell: |
        ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
        dpkg-reconfigure --frontend noninteractive tzdata

    - name: Update system
      apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        lock_timeout: 600
      register: result_os_update
      retries: 10
      delay: 10
      until: result_os_update is not failed

    - name: Install packages
      apt:
        name:
          - curl
          - python3
          - vim
          - iptables
          - iptables-persistent
          - cron
          - locales
        update_cache: true
        lock_timeout: 600

    - name: Set password for root
      user:
        name: root
        password: "{{ newborn_password | password_hash('sha512', newborn_password_salt) }}"

    - name: Set hostname
      hostname:
        name: "{{ newborn_hostname }}"
        use: systemd

    - name: Add hostname to /etc/hosts
      lineinfile:
        path: /etc/hosts
        line: "{{ item }} {{ newborn_hostname }}"
      loop:
        - 127.0.0.1
        - ::1

    - name: Generate UTF-8 locale
      community.general.locale_gen:
        name: en_US.UTF-8
        state: present

    - name: Set default locale
      lineinfile:
        path: /etc/default/locale
        regexp: '^LANG='
        line: 'LANG=en_US.UTF-8'

    - name: Ensure LC_ALL is set
      lineinfile:
        path: /etc/default/locale
        regexp: '^LC_ALL='
        line: 'LC_ALL=en_US.UTF-8'

    # ┌──────────────┐
    # │   FIREWALL   │
    # └──────────────┘

    - name: Update iptables script
      blockinfile:
        path: /root/newborn/iptables.sh
        block: "{{ firewall_http_cloudflare | indent(width=4, first=True) }}"
        marker: "    # {mark} ANSIBLE MANAGED BLOCK : HTTP"
        state: present
      when: newborn_firewall_http == 'cloudflare'

    - name: Update iptables script
      blockinfile:
        path: /root/newborn/iptables.sh
        block: "{{ firewall_http_anywhere | indent(width=4, first=True) }}"
        marker: "    # {mark} ANSIBLE MANAGED BLOCK : HTTP"
        state: present
      when: newborn_firewall_http == 'anywhere'

    - name: Execute the iptables script
      shell: /root/newborn/iptables.sh

    - name: Create a cron job to apply iptables
      cron:
        name: Update iptables rules
        user: root
        minute: '{{ 59 | random }}'
        hour: '{{ 23 | random }}'
        job: '/root/newborn/iptables.sh >/dev/null 2>&1'

    - name: Create a cron job to fix iptables
      cron:
        name: Lookup iptables rules and fix if needed
        user: root
        minute: '*/5'
        job: '/root/newborn/iptables.sh fix >/dev/null 2>&1'

    # ┌──────────┐
    # │   BASH   │
    # └──────────┘

    - name: Copy .bashrc file
      copy:
        src: configs/bash
        dest: /etc/bash.bashrc
        owner: root
        group: root
        mode: '0644'

    - name: Delete root-related .bashrc file
      file:
        path: /root/.bashrc
        state: absent

    - name: Set server name to .bashrc file
      lineinfile:
        path: /etc/bash.bashrc
        regexp: '^MYHOSTNAME=""$'
        line: 'MYHOSTNAME="{{ newborn_name }}"'

    # ┌─────────────────┐
    # │   REMOVE SNAP   │
    # └─────────────────┘

    - name: Remove all installed snaps
      script: scripts/remove_snap.sh
      when: newborn_remove_snap == "y"

    - name: Check if snap-related systemd unit files exist
      stat:
        path: "/lib/systemd/system/{{ item.file_name }}"
      when: newborn_remove_snap == "y"
      register: snap_unit_stats
      loop_control:
        label: "{{ item.name }}"
      loop:
        - name: snapd
          file_name: snapd.service
        - name: snapd.socket
          file_name: snapd.socket

    - name: Stop snap services
      service:
        name: "{{ item.item.name }}"
        state: stopped
        enabled: false
      when:
        - newborn_remove_snap == "y"
        - item.stat.exists
      loop_control:
        label: "{{ item.item.name }}"
      loop: "{{ snap_unit_stats.results }}"

    - name: Remove snap package itself
      apt:
        name: snapd
        state: absent
        purge: yes
        autoremove: yes
        update_cache: yes
      when: newborn_remove_snap == "y"

    - name: Clean up snap data
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/cache/snapd
        - "{{ ansible_env.HOME }}/snap"
      when: newborn_remove_snap == "y"

    # ┌────────────┐
    # │   DOCKER   │
    # └────────────┘

    - name: Add Docker apt repository key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/trusted.gpg.d/docker.asc
        mode: '0644'
      when: newborn_oci_runtime == "docker"

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch={{ newborn_arch.stdout }} signed-by=/etc/apt/trusted.gpg.d/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        update_cache: yes
      when: newborn_oci_runtime == "docker"

    - name: Install Docker
      apt:
        name: docker-ce
        lock_timeout: 600
      when: newborn_oci_runtime == "docker"

    - name: Copy Docker daemon logging config file
      copy:
        src: configs/docker-daemon.json
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
      when: newborn_oci_runtime == "docker"

    - name: Restart Docker daemon
      service:
        name: docker
        state: restarted
      when: newborn_oci_runtime == "docker"

    - name: Create Docker plugins directory
      file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
      when: newborn_oci_runtime == "docker" and newborn_oci_compose == "y"

    - name: Install Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/v5.0.2/docker-compose-{{ ansible_system }}-{{ ansible_architecture }}"
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        mode: '0755'
      when: newborn_oci_runtime == "docker" and newborn_oci_compose == "y"

    # ┌────────────┐
    # │   PODMAN   │
    # └────────────┘

    - name: Install Podman
      apt:
        name: podman
        lock_timeout: 600
      when: newborn_oci_runtime == "podman"

    - name: Install Podman Compose
      apt:
        name: podman-compose
      when: newborn_oci_runtime == "podman" and newborn_oci_compose == "y"

    # ┌─────────┐
    # │   K0S   │
    # └─────────┘

    - name: Download k0s binary
      get_url:
        url: https://get.k0s.sh
        dest: /tmp/k0s-install.sh
        mode: '0755'
      when: newborn_k8s_runtime == "k0s"

    - name: Run k0s installer script
      command: /tmp/k0s-install.sh
      when: newborn_k8s_runtime == "k0s"

    - name: Remove k0s installer script
      file:
        path: /tmp/k0s-install.sh
        state: absent
      when: newborn_k8s_runtime == "k0s"

    - name: Make directory for k0s configuration
      file:
        path: /etc/k0s
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: newborn_k8s_runtime == "k0s"

    - name: Create k0s configuration file
      shell: k0s config create > /etc/k0s/k0s.yaml
      when: newborn_k8s_runtime == "k0s"

    # > sudo k0s install controller -c /etc/k0s/k0s.yaml --enable-worker --kubelet-extra-args="--node-ip=10.92.0.2 --address=10.92.0.2" && sudo k0s start
    # > sudo k0s kubeconfig admin > ~/.kube/config
    # > kubectl get nodes -o wide -w
    # > sudo k0s token create --role=worker
    #
    # on worker:
    # > sudo k0s install worker --token-file .token --kubelet-extra-args="--node-ip=10.92.0.3 --address=10.92.0.3" && sudo k0s start

    # ┌──────────────┐
    # │   MICROK8S   │
    # └──────────────┘

    - name: Install Snap
      apt:
        name:
          - snapd
        lock_timeout: 600
      when: newborn_k8s_runtime == "microk8s"

    - name: Install MicroK8S
      shell: snap install microk8s --classic
      when: newborn_k8s_runtime == "microk8s"

    # ┌──────────┐
    # │   USER   │
    # └──────────┘

    - name: Create user "{{ newborn_user }}"
      user:
        name: "{{ newborn_user }}"
        password: "{{ newborn_password | password_hash('sha512', newborn_password_salt) }}"
        shell: /bin/bash

    - name: Add user "{{ newborn_user }}" to group "sudo"
      user:
        name: "{{ newborn_user }}"
        groups: sudo
        append: true

    - name: Add user "{{ newborn_user }}" to group "docker"
      user:
        name: "{{ newborn_user }}"
        groups: docker
        append: true
      when: newborn_oci_runtime == "docker"

    - name: Create directory ~/.kube
      file:
        path: "/home/{{ newborn_user }}/.kube"
        state: directory
        owner: "{{ newborn_user }}"
        group: "{{ newborn_user }}"
        mode: '0755'
      when: newborn_k8s_runtime == "k0s"

    - name: Create file ~/.kube/config
      file:
        path: "/home/{{ newborn_user }}/.kube/config"
        state: touch
        owner: "{{ newborn_user }}"
        group: "{{ newborn_user }}"
        mode: '0600'
      when: newborn_k8s_runtime == "k0s"

    - name: Add kubectl alias to .bashrc
      lineinfile:
        path: /etc/bash.bashrc
        line: alias kubectl='k0s kubectl --kubeconfig=$HOME/.kube/config'
        create: yes
      when: newborn_k8s_runtime == "k0s"

    - name: Add user "{{ newborn_user }}" to group "microk8s"
      user:
        name: "{{ newborn_user }}"
        groups: microk8s
        append: true
      when: newborn_k8s_runtime == "microk8s"

    - name: Remove .bashrc file related to user "{{ newborn_user }}"
      file:
        path: "/home/{{ newborn_user }}/.bashrc"
        state: absent

    - name: Create .ssh directory for user "{{ newborn_user }}"
      file:
        path: "/home/{{ newborn_user }}/.ssh"
        state: directory
        owner: "{{ newborn_user }}"
        group: "{{ newborn_user }}"

    - name: Add SSH key for user "{{ newborn_user }}"
      lineinfile:
        path: "/home/{{ newborn_user }}/.ssh/authorized_keys"
        line: "{{ newborn_ssh_key_public }}"
        create: yes
        owner: "{{ newborn_user }}"
        group: "{{ newborn_user }}"
        mode: '0644'

    # ┌────────────────────┐
    # │   OPENSSH SERVER   │
    # └────────────────────┘

    - name: Set OpenSSH server config
      copy:
        src: configs/sshd
        dest: /etc/ssh/sshd_config
        mode: '0644'

    - name: Set SSH port to OpenSSH config file
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^Port '
        line: "Port {{ newborn_ssh_port }}"

    - name: Restart OpenSSH server
      systemd_service:
        name: ssh
        state: restarted
        daemon_reload: true

    - name: Execute the iptables update script to reflect changes in SSH port
      shell: /root/newborn/iptables.sh
